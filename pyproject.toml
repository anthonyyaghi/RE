[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jskre-deal-finder"
version = "0.1.0"
description = "Collect and analyse JSK Real Estate listings for renovation-flip margin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jskre = "jskre.cli:main"

[tool.setuptools]
packages = ["jskre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
